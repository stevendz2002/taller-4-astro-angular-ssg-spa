name: Publicar Astro y Angular en GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Astro-SSG/package-lock.json
            Client-Angular/package-lock.json
      - name: Detectar la ruta pública de GitHub Pages
        id: pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Compilar Astro
        working-directory: Astro-SSG
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PAGES_CONFIGURED: ${{ steps.pages.outcome }}
        run: |
          base="$PAGES_BASE"
          if [ "$PAGES_CONFIGURED" = skipped ]; then base="/$REPOSITORY_NAME"; fi
          npm ci
          npm run build -- --base "${base%/}/astro/"
      - name: Probar y compilar Angular
        working-directory: Client-Angular
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PAGES_CONFIGURED: ${{ steps.pages.outcome }}
        run: |
          base="$PAGES_BASE"
          if [ "$PAGES_CONFIGURED" = skipped ]; then base="/$REPOSITORY_NAME"; fi
          npm ci
          npm test -- --runInBand
          npm run build -- --configuration production,pages --base-href "${base%/}/angular/" --output-path dist/pages
      - name: Preparar ambas demos
        run: |
          mkdir -p site/astro site/angular
          cp -R Astro-SSG/dist/. site/astro/
          cp -R Client-Angular/dist/pages/browser/. site/angular/
          cp pages/index.html site/index.html
          test -s site/astro/users/index.html
          test -s site/angular/index.html
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verificar las dos demos
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for route in '' 'astro/users/' 'angular/'; do
            curl --fail --silent --show-error --retry 6 --retry-all-errors "${SITE_URL}$route" -o /dev/null
          done
